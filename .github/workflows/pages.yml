name: Publier l’application sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - Application.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le fichier à publier
        run: |
          mkdir -p _site
          cp Application.html _site/index.html
      - name: Transférer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
